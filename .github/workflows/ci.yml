name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build frontend bundle
        run: npm run build

      - name: Smoke-test production server on Node 24
        run: |
          NODE_ENV=production PORT=3000 node server.ts &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 0.5
          done
          echo "Server failed health check"
          exit 1
