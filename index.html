<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>QuizDuel — Private MCQ Arena</title>
    <meta
      name="description"
      content="Host a private MCQ arena with secret lock-in, Exam (+1/-0.25/skip), Accuracy, and Speed scoring modes, simultaneous reveal, and detailed participant comparison."
    />
    <meta property="og:title" content="QuizDuel — Private MCQ Arena" />
    <meta
      property="og:description"
      content="Host a private MCQ arena with secret lock-in, Exam (+1/-0.25/skip), Accuracy, and Speed scoring modes, simultaneous reveal, and detailed participant comparison."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('quizduel_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0B1221');
          }
        } catch (e) {
          // keep default white mode
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-amber-400/30 selection:text-amber-950 dark:selection:text-amber-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
